/*6 vintage + copper kettle*/(i,k,p,ac,c,id)=>AR(300,190,`<g fill="none" stroke="${p[2]}" stroke-width="1.2"><rect x="6" y="6" width="288" height="178" opacity=".0"/></g><g fill="${p[2]}"><text x="150" y="22" text-anchor="middle" font-size="9" letter-spacing="3" font-family="serif">FINEST BLEND</text><text x="150" y="182" text-anchor="middle" font-size="9" letter-spacing="3" font-family="serif">AGORA · TASHKENT</text></g>`,TZPOUR(i,k,id,O(300,190,{pot:6,wv:6,tx:152,ty:52,sc:.5})))+body(c),

/*9 honey + porcelain*/(i,k,p,ac,c,id)=>{let hx='';for(let r=0;r<5;r++)for(let q=0;q<7;q++){const x=q*46+(r%2?23:0)-10,y=70+r*40,f=((q*7+r*3+3)%5);hx+=`<polygon points="${[0,1,2,3,4,5].map(a=>(x+22*Math.cos(a*Math.PI/3+Math.PI/6)).toFixed(1)+','+(y+22*Math.sin(a*Math.PI/3+Math.PI/6)).toFixed(1)).join(' ')}" fill="${f<2?'url(#'+id+'h)':'none'}" stroke="${p[2]}" stroke-width="1.4" stroke-opacity=".5"/>`}return AR(300,230,`<defs><linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="${ac}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="300" height="230" fill="${p[0]}" opacity=".3"/>${hx}<path d="M0 0H300V20C292 20 290 40 284 40C278 40 278 24 266 24C252 24 254 50 244 50C234 50 236 28 220 28C200 28 204 18 190 18C176 18 178 40 168 40C158 40 160 22 144 22C128 22 132 60 120 60C108 60 112 24 96 24C80 24 84 34 74 34C64 34 66 20 52 20C38 20 40 44 30 44C20 44 22 22 0 22Z" fill="url(#${id}h)"/>`,TZPOUR(i,k,id,O(300,230,{pot:0,wv:9,tx:150,ty:58,sc:.5})))+body(c)},

/*12 rishtan + cobalt pot flipped*/(i,k,p,ac,c,id)=>AR(300,220,`<rect width="300" height="220" fill="#f6f2e6"/><g fill="none" stroke="#1c3f94" stroke-width="1.5"><rect x="8" y="8" width="284" height="204"/><rect x="14" y="14" width="272" height="192" stroke-width=".7"/></g><g fill="#19a6a1">${[[34,34],[266,34],[34,186],[266,186]].map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="9"/><circle cx="${d[0]}" cy="${d[1]}" r="3.5" fill="#1c3f94"/>`).join('')}</g>`,TZPOUR(i,k,id,O(300,220,{pot:5,wv:7,flip:1,tx:152,ty:50,sc:.5})))+body(c)
]})();
const TZITEM=i=>{const k=TZK(i),p=TZP[k],ac=TZA[k],id='d'+SID(i.id),sd=[...String(i.id)].reduce((a,c)=>a+c.charCodeAt(0),3)%90+1,vi=/^t(\d+)$/.test(i.id)?(+RegExp.$1)%13:[...String(i.id+i.n)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%13;
const c={n:NM(i),d:`<p class="q-d">${U(i.ru,i.uz,i.en)}</p>`,h:(i.hru||i.huz)?`<p class="q-h">${U(i.hru,i.huz,i.hen)}</p>`:'',p:i.price?`<b class="q-p">${E(i.price)}<small> ${CUR()}</small></b>`:'',st:(i.off?STPH():'')+(edit&&i.hide?SKR():''),ia:IA(i),k:TZT(i)};
TZVI=vi;const inner=TZD[vi](i,k,p,ac,c,id,sd);return `<article class="tz-i dz dz${vi}${O(i)}" style="--a:${p[0]};--b:${p[1]};--c:${p[2]};--x:${ac}">${inner}</article>`};
const TZROW=i=>{const k=TZK(i),p=TZP[k],ac=TZA[k];
return `<article class="tz-r${O(i)}" style="--b:${p[1]};--x:${ac}"><div class="tr-h"><h3 class="tr-n">${NM(i)}</h3><span class="tr-l"></span>${i.price?`<b class="tr-p">${E(i.price)}<small> ${CUR()}</small></b>`:''}</div><span class="tr-k">${TK(TZT(i))}</span><p class="tr-d">${U(i.ru,i.uz,i.en)}</p>${(i.hru||i.huz)?`<p class="tr-e">${U(i.hru,i.huz,i.hen)}</p>`:''}${(i.off?STPH():'')+(edit&&i.hide?SKR():'')}${IA(i)}</article>`};
const TZB=(c,its)=>'<div class="tz-w"><div class="fr-n"><i></i><span>'+TX('Только натуральные ингредиенты','Faqat tabiiy ingredientlar','Only natural ingredients')+'</span><i></i></div>'+GR(c,its,list=>'<div class="tz-g">'+list.map(TZROW).join('')+'</div>')+'</div>';
const GEN=(c,its)=>{const d=DSI(c),l=d?d[7]:0;return '<div class="dz L'+l+'">'+GR(c,its,list=>'<div class="dg">'+list.map((i,n)=>GI(l,i,n)).join('')+'</div>')+'</div>'};
