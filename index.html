: merchants sold “qatarmizat” — lemon juice with sugar.", "style": "frut", "m": "bar"}, {"id": "fresh", "n": "Fresh Juices", "nr": "Фреши", "nu": "Fresh sharbatlar", "lru": "Свежевыжатые соки: без сахара, без воды, выжимаем при заказе. 300 мл.", "luz": "Yangi siqilgan sharbatlar: shakarsiz, suvsiz, buyurtma bilan siqiladi. 300 ml.", "len": "Freshly squeezed juices: no sugar, no water, pressed to order. 300 ml.", "style": "frut", "m": "bar"}, {"id": "tea", "n": "Tea", "nr": "Чай", "nu": "Choy", "lru": "Чай родом из Китая: по легенде, император Шэньнун открыл его около 2737 года до н. э., когда в его кипящую воду упали листья дикого чайного куста. В Центральную Азию чай пришёл по Великому шёлковому пути и стал частью узбекского гостеприимства: чайник на столе значит, что гостям рады.\nЧай из натуральных ингредиентов: листовой чай, фрукты, ягоды, травы и мёд. Горячий чайник и холодный графин, 1 л.", "luz": "Choy Xitoydan chiqqan: rivoyatga ko'ra, imperator Shennun uni miloddan avvalgi 2737-yil atrofida, qaynayotgan suviga yovvoyi choy butasining barglari tushganda kashf etgan. Markaziy Osiyoga choy Buyuk ipak yo'li orqali kelgan va o'zbek mehmondo'stligining bir qismiga aylangan: dasturxondagi choynak mehmonlarga xush kelibsiz degani.\nTabiiy ingredientlardan choy: bargli choy, meva, rezavor, o'tlar va asal. Issiq choynak va sovuq grafin, 1 l.", "len": "Tea comes from China: legend says Emperor Shennong discovered it around 2737 BC, when leaves of a wild tea bush fell into his boiling water. It reached Central Asia along the Great Silk Road and became part of Uzbek hospitality: a teapot on the table means guests are welcome.\nTea from natural ingredients: loose-leaf tea, fruit, berries, herbs and honey. Hot teapot and cold carafe, 1 L.", "style": "tsl", "m": "bar"}, {"id": "sp", "n": "Spirits & Liqueurs", "nr": "Крепкие напитки и ликёры", "nu": "Kuchli ichimliklar va likyorlar", "lru": "Цена за порцию 50 мл, за бутылку 0,5 л и за бутылку 1 л (у некоторых позиций — 0,7 "", "meta": "27%", "ru": "Jack Daniel's Tennessee Honey, сахар, Angostura, цедра апельсина. Размешивание со льдом, низкий стакан.", "uz": "Jack Daniel's Tennessee Honey, shakar, Angostura, apelsin po'sti. Muz bilan aralashtiriladi, past stakan.", "en": "Jack Daniel's Tennessee Honey, sugar, Angostura, orange peel. Stirred over ice, rocks glass.", "hru": "Слово «коктейль» впервые описали в 1806 году как смесь спирта, сахара, воды и биттера — это и есть Old Fashioned. Имя «по-старинке» он получил позже, когда гости просили готовить его как раньше.", "huz": "«Kokteyl» so'zi 1806-yilda birinchi marta spirt, shakar, suv va bitterdan iborat aralashma sifatida ta'riflangan — bu aynan Old Fashioned. «Eskicha» nomini keyinroq oldi: mehmonlar uni avvalgidek tayyorlashni so'ragan.", "hen": "The word “cocktail” was first defined in 1806 as a mix of spirit, sugar, water and bitters — exactly an Old Fashioned. It earned its name later, when guests asked for it made the way it used to be.", "price": "115 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c1", "cat": "cock", "n": "Negroni", "nr": "Негрони", "nu": "", "meta": "22%", "ru": "Gordon's, Campari, Cinzano Rosso. Размешивание со льдом, ломтик апельсина.", "uz": "Gordon's, Campari, Cinzano Rosso. Muz bilan aralashtiriladi, apelsin bo'lagi.", "en": "Gordon's, Campari, Cinzano Rosso. Stirred over ice, orange slice.", "hru": "Флоренция, 1919: граф Камилло Негрони попросил бармена заменить в «Американо» содовую джином, а лимон — апельсиновой цедрой. Так родился самый итальянский из аперитивов.", "huz": "Florensiya, 1919: graf Kamillo Negroni bardan «Amerikano»dagi sodani jinga, limonni esa apelsin po'stlog'iga almashtirishni so'ragan. Shunday qilib italyan aperitivlarining eng italyanchasi tug'ilgan.", "hen": "Florence, 1919: Count Camillo Negroni asked the bartender to swap the soda in his Americano for gin and the lemon for orange peel. That is how the most Italian of aperitifs was born.", "price": "95 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c2", "cat": "cock", "n": "Martini", "nr": "Мартини", "nu": "", "meta": "29%", "ru": "Gordon's, Cinzano Extra Dry. Размешивание, охлаждённая рюмка, оливка или цедра лимона.", "uz": "Gordon's, Cinzano Extra Dry. Aralashtiriladi, sovitilgan qadah, zaytun yoki limon po'sti.", "en": "Gordon's, Cinzano Extra Dry. Stirred, chilled glass, olive or lemon twist.", "hru": "Кто изобрёл его — Сан-Франциско или Нью-Йорк, — спорят до сих пор. А прославил Мартини Джеймс Бонд, потребовавший «взболтать, но не смешивать».", "huz": "Uni kim o'ylab topgan — San-Fransiskomi yoki Nyu-York — bu haqda hamon bahslashadi. Martinini esa Jeyms Bond mashhur qildi: u «chayqatib, lekin aralashtirmay» tayyorlashni talab qilgan.", "hen": "San Francisco and New York still argue over who invented it. It was James Bond who made the Martini a legend by ordering it “shaken, not stirred”.", "price": "85 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c3", "cat": "cock", "n": "Whiskey Sour", "nr": "Виски Сауэр", "nu": "", "meta": "13%", "ru": "Jack Daniel's Tennessee Honey, сок лимона, сахарный сироп, яичный белок. Шейкер, низкий стакан, нежная пенка.", "uz": "Jack Daniel's Tennessee Honey, limon sharbati, shakar siropi, tuxum oqi. Shaker, past stakan, nozik ko'pik.", "en": "Jack Daniel's Tennessee Honey, lemon juice, sugar syrup, egg white. Shaken, rocks glass, silky foam.", "hru": "Рецепт напечатан в 1862 году в справочнике Джерри Томаса — «отца барного дела». Кислоту к спирту добавляли и моряки: цитрусы брали в плавание от цинги.", "huz": "Retsept 1862-yilda «bar ishi otasi» Jerri Tomasning qo'llanmasida bosilgan. Spirtga nordonlikni dengizchilar ham qo'shishgan: sitruslar singadan saqlash uchun safarga olib ketilgan.", "hen": "The recipe was printed in 1862 in the guide of Jerry Thomas, the “father of bartending”. Sailors had long added citrus to spirits too, taking it along on voyages against scurvy.", "price": "85 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m1", "cat": "cock", "n": "Manhattan", "nr": "Манхэттен", "nu": "", "meta": "27%", "ru": "Monkey Shoulder, красный вермут Cinzano Rosso, Angostura. Размешивание, охлаждённая рюмка.", "uz": "Monkey Shoulder, qizil vermut Cinzano Rosso, Angostura. Aralashtiriladi, sovitilgan qadah.", "en": "Monkey Shoulder, Cinzano Rosso red vermouth, Angostura. Stirred, chilled glass.", "hru": "По легенде, его придумали в нью-йоркском Manhattan Club в 1870-х на приёме, который устроила мать Уинстона Черчилля. Историки сомневаются, но легенда слишком хороша, чтобы её отменять.", "huz": "Rivoyatga ko'ra, uni 1870-yillarda Nyu-Yorkdagi Manhattan Club'da Uinston Cherchillning onasi uyushtirgan qabul uchun o'ylab topishgan. Tarixchilar shubhalanadi, lekin rivoyat bekor qilib bo'lmas darajada yaxshi.", "hen": "Legend says it was created at New York's Manhattan Club in the 1870s for a reception hosted by Winston Churchill's mother. Historians doubt it, but the story is too good to cancel.", "price": "130 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m4", "cat": "cock", "n": "Sidecar", "nr": "Сайдкар", "nu": "", "meta": "25%", "ru": "Hennessy V.S.O.P, Grand Marnier, сок лимона. Шейкер, сахарная кайма.", "uz": "Hennessy V.S.O.P, Grand Marnier, limon sharbati. Shaker, shakar hoshiyasi.", "en": "Hennessy V.S.O.P, Grand Marnier, lemon juice. Shaken, sugar rim.", "hru": "Говорят, назван в честь мотоциклетной коляски: капитан, любивший этот коктейль, приезжал в парижский бар именно в ней. Эпоха — около 1920 года, автор до сих пор неизвестен.", "huz": "Aytishlaricha, nomi mototsikl yon aravachasidan olingan: bu kokteylni sevgan kapitan Parij barlariga aynan shunda kelgan. Davri — taxminan 1920-yil, muallifi esa hanuz noma'lum.", "hen": "They say it is named after a motorcycle sidecar: the captain who loved this drink arrived at his Paris bar in one. The era is around 1920, and the author is still unknown.", "price": "185 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m5", "cat": "cock", "n": "Black Russian", "nr": "Блэк Рашн", "nu": "", "meta": "33%", "ru": "Absolut, Kahlúa. Подаётся со льдом в низком стакане.", "uz": "Absolut, Kahlúa. Past stakanda muz bilan beriladi.", "en": "Absolut, Kahlúa. Served over ice in a rocks glass.", "hru": "Брюссель, 1949: бармен Густав Топс из отеля Metropole придумал его для Перл Месты, американского посла в Люксембурге. Кофейный ликёр с водкой — тёмный, как чёрная икра.", "huz": "Bryussel, 1949: Metropole mehmonxonasi bartenderi Gustav Tops uni Lyuksemburgdagi AQSh elchisi Perl Mesta uchun o'ylab topgan. Aroq bilan qahva likyori — qora ikradek to'q.", "hen": "Brussels, 1949: Gustave Tops, a bartender at Hotel Metropole, created it for Perle Mesta, the US ambassador to Luxembourg. Coffee liqueur with vodka — dark as black caviar.", "price": "100 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m6", "cat": "cock", "n": "Americano", "nr": "Американо", "nu": "", "meta": "10%", "ru": "Campari и Cinzano Rosso, содовая. Сборка в бокале со льдом, ломтик апельсина.", "uz": "Campari va Cinzano Rosso, soda. Muzli qadahda tayyorlanadi, apelsin bo'lagi.", "en": "Campari and Cinzano Rosso, soda. Built over ice, orange slice.", "hru": "Campari из Милана плюс вермут из Турина — так он назывался Milano-Torino. «Американо» его прозвали из-за американских туристов, которым он полюбился. Это первый напиток, который Джеймс Бонд заказывает в романе «Казино Рояль».", "huz": "Milanlik Campari va Turinlik vermut — dastlab u Milano-Torino deb atalgan. «Amerikano» deb uni sevib qolgan amerikalik sayyohlar tufayli atashgan. «Kazino Royal» romanida Jeyms Bond birinchi bo'lib aynan shuni buyurtma qiladi.", "hen": "Campari from Milan plus vermouth from Turin: it was first called Milano-Torino. It became “Americano” thanks to the American tourists who loved it. It is also the first drink James Bond orders in the novel “Casino Royale”.", "price": "85 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m14", "cat": "cock", "n": "Cuba Libre", "nr": "Куба Либре", "nu": "", "meta": "9%", "ru": "Captain Morgan Original Spiced Gold, кола, сок лайма. Сборка в высоком стакане со льдом.", "uz": "Captain Morgan Original Spiced Gold, kola, laym sharbati. Baland stakanda muz bilan tayyorlanadi.", "en": "Captain Morgan Original Spiced Gold, cola, lime juice. Built in a highball glass over ice.", "hru": "Гавана, около 1900 года, сразу после войны за независимость: по легенде, американский офицер смешал ром Bacardi с колой и поднял тост «Por Cuba libre!» — «За свободную Кубу!»", "huz": "Gavana, taxminan 1900-yil, mustaqillik urushidan so'ng: rivoyatga ko'ra, amerikalik ofitser Bacardi romini kola bilan aralashtirib, «Por Cuba libre!» — «Ozod Kuba uchun!» deb tost aytgan.", "hen": "Havana, around 1900, right after the war of independence: legend says an American officer mixed Bacardi rum with cola and toasted “Por Cuba libre!” — “To a free Cuba!”", "price": "85 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m17", "cat": "cock", "n": "Gin & Tonic", "nr": "Джин-тоник", "nu": "", "meta": "9%", "ru": "Gordon's, тоник, долька лайма. Сборка в высоком стакане со льдом.", "uz": "Gordon's, tonik, laym bo'lagi. Baland stakanda muz bilan tayyorlanadi.", "en": "Gordon's, tonic, lime wedge. Built in a highball glass over ice.", "hru": "Британские офицеры в Индии пили тоник с хинином от малярии, а горечь перебивали джином. Лекарство стало любимым коктейлем, а в Испании его подают в огромном бокале-«аквариуме».", "huz": "Hindistondagi britaniyalik ofitserlar bezgakka qarshi xininli tonik ichgan, achchiqligini esa jin bilan bosishgan. Dori sevimli kokteylga aylangan, Ispaniyada esa uni ulkan «akvarium» qadahda berishadi.", "hen": "British officers in India drank quinine tonic against malaria and masked the bitterness with gin. The medicine became a favourite cocktail — in Spain it is served in an enormous goblet like a fishbowl.", "price": "95 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m18", "cat": "cock", "n": "Long Island Iced Tea", "nr": "Лонг-Айленд Айс Ти", "nu": "", "meta": "19%", "ru": "Absolut, Gordon's, Captain Morgan White, Cuervo Silver, Grand Marnier, лимонный сок, сахарный сироп, кола. Сборка в высоком стакане со льдом.", "uz": "Absolut, Gordon's, Captain Morgan White, Cuervo Silver, Grand Marnier, limon sharbati, shakar siropi, kola. Baland stakanda muz bilan tayyorlanadi.", "en": "Absolut, Gordon's, Captain Morgan White, Cuervo Silver, Grand Marnier, lemon juice, sugar syrup, cola. Built in a highball glass over ice.", "hru": "Чая в нём нет: пять видов крепкого спирта и кола дают цвет холодного чая. По одной из версий, его придумал в 1972 году Роберт «Росбад» Батт в баре Oak Beach Inn на Лонг-Айленде; по другой — Чарли Бишоп в Теннесси во времена Сухого закона.", "huz": "Unda choy yo'q: besh xil kuchli spirt va kola sovuq choy rangini beradi. Bir versiyaga ko'ra, uni 1972-yilda Long-Aylenddagi Oak Beach Inn barida Robert «Rozbad» Batt o'ylab topgan; boshqasiga ko'ra — Quruq qonun davrida Tennessida Charli Bishop.", "hen": "There is no tea in it: five kinds of spirit and cola give it the colour of iced tea. By one version it was created in 1972 by Robert “Rosebud” Butt at the Oak Beach Inn on Long Island; by another, by Charlie Bishop in Tennessee during Prohibition.", "price": "120 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "m20", "cat": "cock", "n": "Death in the Afternoon", "nr": "Смерть после полудня", "nu": "", "meta": "18%", "ru": "Xenta Absinthe, игристое вино сверху. Бокал-флюте.", "uz": "Xenta Absinthe, ustiga ko'pikli vino. Flyut qadah.", "en": "Xenta Absinthe, topped with sparkling wine. Flute glass.", "hru": "Назван по книге Хемингуэя о корриде «Смерть после полудня». Свой рецепт он записал в 1935 году и советовал пить «три-пять таких, медленно»: игристое превращает абсент в молочно-опаловый.", "huz": "Nomi Xeminguey'ning korrida haqidagi «Tushdan keyingi o'lim» kitobidan olingan. U retseptini 1935-yilda yozib qoldirgan va «bunday uch-beshtasini sekin ichish»ni maslahat bergan: ko'pikli vino absentni sutdek opal rangga aylantiradi.", "hen": "Named after Hemingway's book on bullfighting, “Death in the Afternoon”. He wrote down his recipe in 1935 and advised drinking “three to five of these, slowly”: the sparkling wine turns the absinthe milky and opalescent.", "price": "75 000", "off": false, "g": "For Him ○ Для него ○ Erkaklar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c4", "cat": "cock", "n": "Margarita", "nr": "Маргарита", "nu": "", "meta": "24%", "ru": "Espolòn Silver, Grand Marnier, сок лайма. Шейкер, соляная кайма.", "uz": "Espolòn Silver, Grand Marnier, laym sharbati. Shaker, tuz hoshiyasi.", "en": "Espolòn Silver, Grand Marnier, lime juice. Shaken, salt rim.", "hru": "По одной из версий, в 1948 году в Акапулько Маргарита Самес смешала его для гостей на вечеринке. По-испански «маргарита» — ромашка, а соль на ободке — отдельная традиция.", "huz": "Bir versiyaga ko'ra, 1948-yilda Akapulkoda Margarita Sames uni ziyofatdagi mehmonlari uchun aralashtirgan. Ispanchada «margarita» — moychechak, qadah chetidagi tuz esa alohida an'ana.", "hen": "One version says Margarita Sames mixed it for party guests in Acapulco in 1948. In Spanish “margarita” means daisy, and the salted rim is a tradition of its own.", "price": "125 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c5", "cat": "cock", "n": "Daiquiri", "nr": "Дайкири", "nu": "", "meta": "18%", "ru": "Captain Morgan White, сок лайма, сахарный сироп. Шейкер, охлаждённая рюмка.", "uz": "Captain Morgan White, laym sharbati, shakar siropi. Shaker, sovitilgan qadah.", "en": "Captain Morgan White, lime juice, sugar syrup. Shaken, chilled glass.", "hru": "Американский инженер Дженнингс Кокс угощал гостей ромом, лаймом и сахаром в кубинском посёлке Дайкири. Полвека спустя его полюбил Хемингуэй — в Гаване для него готовили вариант без сахара.", "huz": "Amerikalik muhandis Jenningz Koks Kubaning Dayqiri qishlog'ida mehmonlarni rom, laym va shakar bilan siylagan. Ellik yil o'tib uni Xeminguey sevib qolgan — Gavanada unga shakarsiz variant tayyorlashgan.", "hen": "The American engineer Jennings Cox treated guests to rum, lime and sugar in the Cuban village of Daiquirí. Half a century later Hemingway adored it — in Havana they made him a sugar-free version.", "price": "85 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c6", "cat": "cock", "n": "Cosmopolitan", "nr": "Космополитан", "nu": "", "meta": "21%", "ru": "Absolut Citron, Grand Marnier, клюквенный сок, сок лайма. Шейкер, двойное процеживание.", "uz": "Absolut Citron, Grand Marnier, klyukva sharbati, laym sharbati. Shaker, ikki marta suziladi.", "en": "Absolut Citron, Grand Marnier, cranberry juice, lime juice. Shaken, double strained.", "hru": "Нью-Йорк, 1988: бармен Тоби Чекини собрал свою версию из цитрусовой водки, клюквы, лайма и Cointreau. Мировую славу ему принесла Кэрри Брэдшоу в «Сексе в большом городе».", "huz": "Nyu-York, 1988: bartender Tobi Cheknini sitrusli aroq, klyukva, laym va Cointreau'dan o'z versiyasini yaratgan. Jahon shuhratini unga «Katta shahardagi jinsiy hayot» serialidagi Keri Bredshou keltirgan.", "hen": "New York, 1988: bartender Toby Cecchini built his version from citrus vodka, cranberry, lime and Cointreau. Carrie Bradshaw in “Sex and the City” made it world famous.", "price": "95 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "w1", "cat": "cock", "n": "Pornstar Martini", "nr": "Порнстар Мартини", "nu": "", "meta": "14%", "ru": "Absolut Vanilia, маракуйя, ваниль, сок лайма. Шот игристого вина подаётся рядом.", "uz": "Absolut Vanilia, marakuya, vanil, laym sharbati. Yoniga ko'pikli vino shoti beriladi.", "en": "Absolut Vanilia, passion fruit, vanilla, lime juice. A shot of sparkling wine served on the side.", "hru": "Лондон, 2002: Дуглас Анкра придумал его в баре Townhouse. Рюмку просекко подают рядом, чтобы запивать, — а сам коктейль стал одним из самых заказываемых в Британии.", "huz": "London, 2002: Duglas Ankra uni Townhouse barida o'ylab topgan. Prosekko qadahi yoniga qo'yiladi — ichimlik ustidan ichish uchun, kokteylning o'zi esa Britaniyada eng ko'p buyurtma qilinadiganlardan biriga aylangan.", "hen": "London, 2002: Douglas Ankrah created it at the Townhouse bar. A shot of prosecco is served on the side to chase it — and the cocktail became one of the most ordered in Britain.", "price": "85 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "w2", "cat": "cock", "n": "Espresso Martini", "nr": "Эспрессо Мартини", "nu": "", "meta": "17%", "ru": "Absolut, Kahlúa, свежий эспрессо. Энергичный шейк, пенка сверху.", "uz": "Absolut, Kahlúa, yangi espresso. Kuchli chayqatiladi, ustida ko'pik.", "en": "Absolut, Kahlúa, fresh espresso. Shaken hard, foam on top.", "hru": "Лондон, начало 1980-х: Дик Брэдселл придумал его для модели, попросившей коктейль, который «разбудит и тут же расслабит». Эспрессо в нём — настоящий, а пенка на поверхности — его подпись.", "huz": "London, 1980-yillar boshi: Dik Bredsell uni «uyg'otadigan va shu zahoti dam beradigan» kokteyl so'ragan modelga atab o'ylab topgan. Undagi espresso — haqiqiy, ustidagi ko'pik esa uning imzosi.", "hen": "London, early 1980s: Dick Bradsell invented it for a model who asked for a drink that would “wake her up and relax her at once”. The espresso is real, and the foam on top is its signature.", "price": "100 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "w11", "cat": "cock", "n": "Pink Gin & Tonic", "nr": "Розовый джин-тоник", "nu": "", "meta": "9%", "ru": "Barrister Pink, тоник, ягоды, веточка розмарина. Подаётся со льдом в большом бокале.", "uz": "Barrister Pink, tonik, rezavor mevalar, rozmarin shoxchasi. Katta qadahda muz bilan beriladi.", "en": "Barrister Pink, tonic, berries, a sprig of rosemary. Served over ice in a large glass.", "hru": "Pink Gin изначально — морской напиток британских офицеров: джин с каплями Angostura, окрашивающими его в розовый. В 2010-х розовые джины вернулись, и цвет стал главным.", "huz": "Pink Gin dastlab britaniyalik ofitserlarning dengiz ichimligi bo'lgan: Angostura tomchilari pushti rang beradigan jin. 2010-yillarda pushti jinlar qaytdi va rang asosiy narsaga aylandi.", "hen": "Pink Gin was originally a naval drink of British officers: gin with drops of Angostura that turn it pink. In the 2010s pink gins returned, and colour became the main attraction.", "price": "85 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "w13", "cat": "cock", "n": "French 75", "nr": "Френч 75", "nu": "", "meta": "16%", "ru": "Gordon's, сок лимона, сахарный сироп, игристое вино сверху. Бокал-флюте.", "uz": "Gordon's, limon sharbati, shakar siropi, ustiga ko'pikli vino. Flyut qadah.", "en": "Gordon's, lemon juice, sugar syrup, topped with sparkling wine. Champagne flute.", "hru": "Париж, 1915 год: назван по французской полевой пушке калибра 75 мм. Говорят, удар джина с шампанским сопоставим с её выстрелом.", "huz": "Parij, 1915-yil: nomi frantsuzcha 75 mm kalibrli dala to'pidan olingan. Aytishlaricha, jin bilan shampan zarbasi uning o'qiga tengdir.", "hen": "Paris, 1915: named after the French 75 mm field gun. They say the kick of gin with champagne is comparable to its shot.", "price": "90 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c_angeldust", "cat": "cock", "n": "Angel Dust", "nr": "Энджел Даст", "nu": "", "meta": "6%", "ru": "Хосе Куэрво, молоко, белый шоколад, клубника.", "uz": "Jose Cuervo, sut, oq shokolad, qulupnay.", "en": "Jose Cuervo, milk, white chocolate, strawberry.", "hru": "«Angel Dust» («ангельская пыль») на жаргоне — уличное название фенциклидина (PCP).", "huz": "«Angel Dust» («farishta changi») jargonda — fensiklidin (PCP)ning ko'cha nomi.", "hen": "“Angel dust” is street slang for phencyclidine (PCP).", "price": "85 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "c_pakhta", "cat": "cock", "n": "Pakhta", "nr": "Пахта", "nu": "Paxta", "meta": "9%", "ru": "Gordon's, молоко, белый шоколад. Шейк с пружиной.", "uz": "Gordon's, sut, oq shokolad. Prujina bilan sheyk.", "en": "Gordon's, milk, white chocolate. Shaken with a spring.", "hru": "Хлопок называют «белым золотом» Узбекистана, а его поля знакомы каждому с детства. Мы сделали коктейль таким же мягким и белым — как облачко хлопка.", "huz": "Paxtani O'zbekistonning «oq oltini» deyishadi, uning dalalari esa bolalikdan hammaga tanish. Biz kokteylni ham shunday yumshoq va oq qildik — paxta bulutidek.", "hen": "Cotton is called the “white gold” of Uzbekistan, and its fields are familiar to everyone from childhood. We made the cocktail just as soft and white — like a cloud of cotton.", "price": "85 000", "off": false, "g": "For Her ○ Для неё ○ Ayollar uchun", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k0", "cat": "cof", "n": "Espresso", "nr": "Эспрессо", "nu": "", "meta": "25 ml · 72 mg", "ru": "Эспрессо.", "uz": "Espresso.", "en": "Espresso.", "hru": "В 1884 году Анджело Мориондо запатентовал в Турине первую паровую кофемашину. «Эспрессо» значит «выжатый специально для вас» — и «быстрый», ведь готовится он за полминуты.", "huz": "1884-yilda Anjelo Moriondo Turinda birinchi bug' qahva mashinasiga patent olgan. «Espresso» — «aynan siz uchun siqib chiqarilgan» va «tez» degani: u yarim daqiqada tayyor bo'ladi.", "hen": "In 1884 Angelo Moriondo patented the first steam coffee machine in Turin. “Espresso” means “pressed out just for you” — and “fast”, as it is ready in about half a minute.", "price": "25 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k6", "cat": "cof", "n": "Espresso Doppio", "nr": "Эспрессо доппио", "nu": "", "meta": "50 ml · 144 mg", "ru": "Двойной эспрессо.", "uz": "Qo'sh espresso.", "en": "Double espresso.", "hru": "Doppio — «двойной»: две порции эспрессо в одной чашке. Те, кому одного глотка мало, заказывают именно его.", "huz": "Doppio — «qo'sh»: bir finjonda ikki porsiya espresso. Bir ho'plam kamlik qilganlar aynan shuni buyurtma qiladi.", "hen": "Doppio means “double”: two shots of espresso in one cup. It is for those who find a single sip too few.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k7", "cat": "cof", "n": "Lungo", "nr": "Лунго", "nu": "", "meta": "60 ml · 72 mg", "ru": "Эспрессо длинной экстракции.", "uz": "Uzun ekstraksiyali espresso.", "en": "Long-extraction espresso.", "hru": "Lungo — «длинный»: воду пропускают через кофе дольше, получается больше напитка и больше горчинки. Итальянцы шутят, что это эспрессо для тех, кто никуда не спешит.", "huz": "Lungo — «uzun»: suv qahva orqali uzoqroq o'tkaziladi, ichimlik ko'proq va achchiqroq bo'ladi. Italiyaliklar hazillashadi: bu hech qayoqqa shoshmaydiganlar uchun espresso.", "hen": "Lungo means “long”: water runs through the coffee for longer, giving more drink and more bitterness. Italians joke that it is espresso for people who are in no hurry.", "price": "27 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k8", "cat": "cof", "n": "Double Lungo", "nr": "Двойной лунго", "nu": "", "meta": "120 ml · 144 mg", "ru": "Двойной эспрессо длинной экстракции.", "uz": "Qo'sh uzun ekstraksiyali espresso.", "en": "Double long-extraction espresso.", "hru": "Двойной «длинный»: две порции эспрессо с долгой экстракцией. Почти чашка, которую можно растянуть на целую беседу.", "huz": "Qo'sh «uzun»: uzoq ekstraksiyali ikki porsiya espresso. Butun suhbatga yetadigan deyarli to'liq piyola.", "hen": "A double “long”: two espressos with a long extraction. Nearly a full cup that can last a whole conversation.", "price": "37 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k1", "cat": "cof", "n": "Americano", "nr": "Американо", "nu": "", "meta": "145 ml · 72 mg", "ru": "Эспрессо, горячая вода.", "uz": "Espresso, issiq suv.", "en": "Espresso, hot water.", "hru": "По легенде, американские солдаты в Италии во Вторую мировую находили эспрессо слишком крепким и разбавляли его горячей водой. Итальянцы назвали это «кофе по-американски».", "huz": "Rivoyatga ko'ra, Ikkinchi jahon urushida Italiyadagi amerikalik askarlar espressoni juda kuchli deb topib, uni issiq suv bilan suyultirishgan. Italiyaliklar buni «amerikancha qahva» deb atashgan.", "hen": "Legend says American soldiers in Italy during WWII found espresso too strong and watered it down with hot water. Italians called it “coffee, American-style”.", "price": "25 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k9", "cat": "cof", "n": "Double Americano", "nr": "Двойной американо", "nu": "", "meta": "170 ml · 144 mg", "ru": "Двойной эспрессо, горячая вода.", "uz": "Qo'sh espresso, issiq suv.", "en": "Double espresso, hot water.", "hru": "Двойной эспрессо, разбавленный горячей водой: та же крепость, но чашка, которую можно пить неспешно. Любимая «большая чашка» всего мира.", "huz": "Issiq suv bilan suyultirilgan qo'sh espresso: kuchi o'sha-o'sha, ammo shoshilmay ichsa bo'ladigan piyola. Butun dunyoning sevimli «katta piyolasi».", "hen": "A double espresso diluted with hot water: the same strength, but a cup you can sip slowly. The world's favourite “big cup”.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k2", "cat": "cof", "n": "Espresso Macchiato", "nr": "Эспрессо макиато", "nu": "", "meta": "50 ml · 72 mg", "ru": "Эспрессо, молочная пена.", "uz": "Espresso, sut ko'pigi.", "en": "Espresso, milk foam.", "hru": "«Macchiato» значит «запятнанный»: эспрессо с каплей молочной пены. Её добавляли, чтобы бариста и официант отличали его от обычного эспрессо.", "huz": "«Macchiato» — «dog'li» degani: bir tomchi sut ko'pigi qo'shilgan espresso. Barista va ofitsiant uni oddiy espressodan farqlashi uchun shunday qilingan.", "hen": "“Macchiato” means “stained”: espresso marked with a spot of milk foam. The spot let the barista and the waiter tell it apart from plain espresso.", "price": "27 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k3", "cat": "cof", "n": "Cappuccino", "nr": "Капучино", "nu": "", "meta": "145 ml · 72 mg", "ru": "Эспрессо, молоко, молочная пена.", "uz": "Espresso, sut, sut ko'pigi.", "en": "Espresso, milk, milk foam.", "hru": "Цвет напитка напоминал коричневые рясы капуцинов — монахов ордена, основанного в XVI веке, — а их капюшон («cappuccio») дал название. В Италии капучино пьют только утром: после обеда на него косо смотрят.", "huz": "Ichimlikning rangi XVI asrda tashkil topgan kapuchin rohiblarining jigarrang kiyimini eslatgan, ularning bosh kiyimi («cappuccio») esa nomni bergan. Italiyada kapuchinoni faqat ertalab ichishadi: tushlikdan keyin unga qiyshiq qarashadi.", "hen": "The colour resembled the brown habits of the Capuchin monks, an order founded in the 16th century, and their hood (“cappuccio”) gave the name. In Italy cappuccino is a morning drink — after lunch it earns sideways glances.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k10", "cat": "cof", "n": "Double Cappuccino", "nr": "Двойной капучино", "nu": "", "meta": "170 ml · 144 mg", "ru": "Двойной эспрессо, молоко, молочная пена.", "uz": "Qo'sh espresso, sut, sut ko'pigi.", "en": "Double espresso, milk, milk foam.", "hru": "Две порции эспрессо под молочной пеной. По итальянской традиции капучино пьют утром — но у нас можно в любое время.", "huz": "Sut ko'pigi ostidagi ikki porsiya espresso. Italiya an'anasiga ko'ra kapuchinoni ertalab ichishadi — bizda esa istalgan vaqtda mumkin.", "hen": "Two shots of espresso under milk foam. By Italian tradition cappuccino is a morning drink — but here you can have it any time.", "price": "47 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k4", "cat": "cof", "n": "Latte", "nr": "Латте", "nu": "", "meta": "245 ml · 72 mg", "ru": "Эспрессо, молоко, нежная пена.", "uz": "Espresso, sut, mayin ko'pik.", "en": "Espresso, milk, silky foam.", "hru": "«Caffè latte» по-итальянски — просто «кофе с молоком». Если в Италии попросить «латте», вам принесут стакан молока.", "huz": "«Caffè latte» italyanchada oddiygina «sutli qahva». Italiyada shunchaki «latte» desangiz, sizga bir stakan sut olib kelishadi.", "hen": "“Caffè latte” in Italian simply means “coffee with milk”. Ask for just a “latte” in Italy and you will be brought a glass of milk.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "k5", "cat": "cof", "n": "Flat White", "nr": "Флэт уайт", "nu": "", "meta": "160 ml · 144 mg", "ru": "Двойной эспрессо, молоко, нежная пена.", "uz": "Qo'sh espresso, sut, mayin ko'pik.", "en": "Double espresso, milk, silky foam.", "hru": "Родину спорят Австралия и Новая Зеландия, обе называют 1980-е. Главное отличие — «плоская» бархатная микропена вместо пышной шапки капучино.", "huz": "Vatani uchun Avstraliya va Yangi Zelandiya bahslashadi, ikkalasi ham 1980-yillarni aytadi. Asosiy farqi — kapuchinodagi pushti ko'pik o'rniga «yassi» baxmal mikroko'pik.", "hen": "Australia and New Zealand dispute its homeland, both naming the 1980s. The key difference is a “flat”, velvety microfoam instead of cappuccino's fluffy cap.", "price": "40 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "l0", "cat": "lem", "n": "Mojito", "nr": "Мохито", "nu": "", "meta": "320|1000", "ru": "Лимон-лайм, тростниковый сахар, мята, газированная вода.", "uz": "Limon-laym, shakarqamish shakari, yalpiz, gazlangan suv.", "en": "Lemon-lime, cane sugar, mint, sparkling water.", "hru": "", "huz": "", "hen": "", "price": "40 000 / 85 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "l1", "cat": "lem", "n": "Tarragon & Apple", "nr": "Тархун и яблоко", "nu": "Tarxun va olma", "meta": "320|1000", "ru": "Тархун, зелёное яблоко, лимон-лайм, газированная вода.", "uz": "Tarxun, yashil olma, limon-laym, gazlangan suv.", "en": "Tarragon, green apple, lemon-lime, sparkling water.", "hru": "", "huz": "", "hen": "", "price": "40 000 / 90 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "l2", "cat": "lem", "n": "Wild Berries", "nr": "Лесные ягоды", "nu": "O'rmon rezavorlari", "meta": "320|1000", "ru": "Смородина, малина, клубника, лимон-лайм, мята, газированная вода.", "uz": "Qoraqat, malina, qulupnay, limon-laym, yalpiz, gazlangan suv.", "en": "Currant, raspberry, strawberry, lemon-lime, mint, sparkling water.", "hru": "", "huz": "", "hen": "", "price": "40 000 / 90 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs":  Bush va Karl Konrad Budvayzdagi bogemiya pivosiga o'xshatib lager pishirgan. «Budweiser» — «Budvayzdan» degani: chex shahri Ceske-Budeyovitsening nemischa nomi; «Bud» esa uning qisqa ismi.", "hen": "USA, 1876: Adolphus Busch and Carl Conrad brewed a lager inspired by the Bohemian beer of Budweis. “Budweiser” means “from Budweis”, the German name of the Czech town České Budějovice; “Bud” is its short name.", "price": "65 000", "off": false, "g": "Bottled", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "b4", "cat": "beer", "n": "Bud 0.0", "nr": "", "nu": "", "meta": "0.44 L", "ru": "безалкогольное", "uz": "alkogolsiz", "en": "non-alcoholic", "hru": "Безалкогольная версия американского лагера Bud, созданного в 1876 году: тот же светлый вкус без градусов.", "huz": "1876-yilda yaratilgan amerikalik Bud lagerining alkogolsiz versiyasi: o'sha yengil ta'm, gradussiz.", "hen": "The alcohol-free version of the American lager Bud, created in 1876: the same light taste without the degrees.", "price": "50 000", "off": false, "g": "Bottled", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "b5", "cat": "beer", "n": "Hoegaarden", "nr": "", "nu": "", "meta": "0.44 L", "ru": "бельгийское пшеничное", "uz": "belgiya bug'doy pivosi", "en": "Belgian wheat beer", "hru": "Бельгийская деревня Хугарден варила белое пиво с XV века — монахи добавляли кориандр и апельсиновую корку. К 1957 году последняя пивоварня закрылась, и молочник Пьер Селис в 1966-м возродил стиль.", "huz": "Belgiyaning Xugarden qishlog'i oq pivoni XV asrdan beri pishirgan — rohiblar koriandr va apelsin po'stlog'i qo'shishgan. 1957-yilga kelib oxirgi pivo zavodi yopilgan, sutchi Pyer Selis esa 1966-yilda bu uslubni qayta tiriltirgan.", "hen": "The Belgian village of Hoegaarden has brewed white beer since the 15th century — monks added coriander and orange peel. By 1957 the last brewery had closed, and the milkman Pierre Celis revived the style in 1966.", "price": "85 000", "off": false, "g": "Bottled", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "b6", "cat": "beer", "n": "Hoegaarden Cherry", "nr": "", "nu": "", "meta": "0.44 L", "ru": "вишнёвое", "uz": "olcha ta'mli", "en": "cherry", "hru": "Вишнёвая версия белого пива Hoegaarden. В Бельгии фруктовое пиво любят давно: вишнёвый крик (kriek) там варят веками.", "huz": "Hoegaarden oq pivosining olcha versiyasi. Belgiyada mevali pivoni qadimdan sevishadi: olchali kriek u yerda asrlar davomida pishiriladi.", "hen": "The cherry version of Hoegaarden's white beer. Belgium has long loved fruit beers — kriek, made with cherries, has been brewed there for centuries.", "price": "85 000", "off": false, "g": "Bottled", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "b7", "cat": "beer", "n": "Hoegaarden Grapefruit", "nr": "", "nu": "", "meta": "0.44 L", "ru": "грейпфрутовое", "uz": "greypfrut ta'mli", "en": "grapefruit", "hru": "Грейпфрутовая версия белого пива Hoegaarden: лёгкая горчинка цитруса хорошо дружит с кориандром, который кладут в классический рецепт.", "huz": "Hoegaarden oq pivosining greypfrut versiyasi: sitrusning yengil achchig'i klassik retseptga solinadigan koriandr bilan yaxshi uyg'unlashadi.", "hen": "The grapefruit version of Hoegaarden's white beer: citrus's light bitterness pairs well with the coriander in the classic recipe.", "price": "85 000", "off": false, "g": "Bottled", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "d3", "cat": "beer", "n": "Sarbast Original", "nr": "", "nu": "", "meta": "0.5 L", "ru": "светлый лагер", "uz": "och lager", "en": "light lager", "hru": "Узбекистан: бренд вырос из совместного предприятия Sarbast Plus, которое в 2008 году стало UzCarlsberg — частью датской Carlsberg Group, основанной в 1847 году.", "huz": "O'zbekiston: brend Sarbast Plus qo'shma korxonasidan o'sib chiqqan, u 2008-yilda UzCarlsberg'ga aylangan — 1847-yilda tashkil etilgan daniyalik Carlsberg Group'ning bir qismi.", "hen": "Uzbekistan: the brand grew out of the Sarbast и пузырьки рождаются сами. Этот метод старше шампанского.", "huz": "PetNat — «tabiiy gazlangan»: vino bijg'ish tugamasdan shishalarga quyiladi va pufakchalar o'zi hosil bo'ladi. Bu usul shampandan ham qadimiy.", "hen": "PetNat means “natural sparkling”: the wine is bottled before fermentation ends, and the bubbles form on their own. The method is older than champagne.", "price": "560 000", "off": false, "g": "MSA", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "mw7", "cat": "x62gapjt6u", "n": "Bayan Shirey MSA", "nr": "Bayan Shirey MSA", "nu": "Bayan Shirey MSA", "meta": "0.75L", "ru": "Тип: Белое сухое\nКрепость: 13%\nСорт винограда: Баян Ширей", "uz": "Turi: Oq quruq vino\nAlkogol miqdori: 13%\nUzum navi: Bayan Shirey", "en": "Type: Dry white\nStrength: 13%\nGrape: Bayan Shirey", "hru": "Баян Ширей — сорт родом из Азербайджана (село Баян, Дашкесанский район). Его выращивают и в Узбекистане.", "huz": "Bayan Shirey — Ozarbayjonda (Bayan qishlog'i, Dashkasan tumani) paydo bo'lgan uzum navi. Uni O'zbekistonda ham yetishtirishadi.", "hen": "Bayan Shirey is a grape from Azerbaijan (the village of Bayan, Dashkasan district). It is grown in Uzbekistan too.", "price": "295 000", "off": false, "g": "MSA", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "mw8", "cat": "x62gapjt6u", "n": "Cabernet Sauvignon", "nr": "Cabernet Sauvignon", "nu": "Cabernet Sauvignon", "meta": "0.75L", "ru": "Тип: Красное сухое\nКрепость: 14%\nСорт винограда: Каберне Совиньон\nАромат и вкус: Чёрная смородина, слива и мягкие специи; плотные танины.", "uz": "Turi: Qizil quruq vino\nAlkogol miqdori: 14%\nUzum navi: Kaberne Sovinyon\nAroma va ta'mi: Qora smorodina, olxo'ri va yumshoq ziravorlar; zich taninlar.", "en": "Type: Dry red\nStrength: 14%\nGrape: Cabernet Sauvignon\nAroma and taste: Blackcurrant, plum and soft spice; firm tannins.", "hru": "В 1997 году анализ ДНК показал: Каберне Совиньон — случайный гибрид Каберне Фран и Совиньон Блан, родом из Бордо. Сегодня это один из lupnayi va karamel; to'yingan rezavor ta'm.", "en": "Type: Sweet rosé\nStrength: 11%\nGrape: Strawberry\nAroma and taste: Strawberry jam, wild strawberry and caramel; a rich berry taste.", "hru": "Fresa по-испански — «клубника». Сладкое розе с ягодным ароматом: десерт в бокале.", "huz": "Fresa ispanchada — «qulupnay». Rezavor xushbo'yli shirin roze: qadahdagi desert.", "hen": "Fresa is Spanish for “strawberry”. A sweet rosé with a berry aroma: dessert in a glass.", "price": "425 000", "off": false, "g": "MSA", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "mw1", "cat": "x62gapjt6u", "n": "Martini Asti", "nr": "Мартини Асти", "nu": "Martini Asti", "meta": "0.75L", "ru": "Тип: Белое игристое сладкое\nКрепость: 7,5%\nСорт винограда: Москато\nАромат и вкус: Спелый персик и абрикос, свежий лимон и нотка бергамота; мелкий мусс и сочный фруктовый вкус.", "uz": "Turi: Oq shirin ko'pikli vino\nAlkogol miqdori: 7,5%\nUzum navi: Moskato\nAroma va ta'mi: Pishgan shaftoli va o'rik, yangi limon va bergamot notasi; mayin ko'pik va mazali mevali ta'm.", "en": "Type: Sweet white sparkling\nStrength: 7.5%\nGrape: Moscato\nAroma and taste: Ripe peach and apricot, fresh lemon and a hint of bergamot; fine mousse and a juicy fruity palate.", "hru": "Игристое из Пьемонта из винограда москато — сладкие пузырьки, которые в Италии подают на праздниках и к десертам. Martini & Rossi работает с 1863 года.", "huz": "Pyemontdan moskato uzumidan tayyorlangan gazlangan vino — Italiyada bayramlarda va desertlar bilan beriladigan shirin pufakchalar. Martini & Rossi 1863-yildan beri ishlaydi.", "hen": "A sparkling wine from Piedmont made from Moscato grapes — the sweet bubbles Italy serves at celebrations and with dessert. Martini & Rossi has been working since 1863.", "price": "430 000", "off": false, "g": "Martini", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "mw2", "cat": "x62gapjt6u", "n": "Martini Prosecco", "nr": "Мартини Просекко", "nu": "Martini Prosecco", "meta": "0.75L", "ru": "Тип: Белое игристое брют\nКрепость: 11,5%\nСорт винограда: Глера\nАромат и вкус: Груша, айва и бузина; во вкусе яблоко, спелый персик и лёгкая медовая нотка, свежее сухое послевкусие.", "uz": "Turi: Oq quruq ko'pikli vino (brut)\nAlkogol miqdori: 11,5%\nUzum navi: Glera\nAroma va ta'mi: Nok, behi va yovvoyi gulxayri; ta'mida olma, pishgan shaftoli va yengil asal notasi, yangi quruq yakuniy ta'm.", "en": "Type: Dry white sparkling (brut)\nStrength: 11.5%\nGrape: Glera\nAroma and taste: Pear, quince and elderflower; apple, ripe peach and a faint honeyed note on the palate, with a fresh dry finish.", "hru": "Название просекко происходит от деревни Просекко близ Триеста. Сорт Глера теперь растёт в Венето — и из него делают самые узнаваемые итальянские пузырьки.", "huz": "Prosekko nomi Triyest yaqinidagi Prosekko qishlog'idan kelib chiqqan. Glera navi hozir Venetoda o'sadi va undan italyan pufakchalarining eng tanish turi tayyorlanadi.", "hen": "Prosecco takes its name from the village of Prosecco near Trieste. The Glera grape now grows in Veneto and makes Italy's most recognisable bubbles.", "price": "430 000", "off": false, "g": "Martini", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "mw3", "cat": "x62gapjt6u", "n": "Martini Prosecco Rosé", "nr": "Мартини Просекко Розе", "nu": "Martini Prosecco Rosé", "meta": "0.75L", "ru": "Тип: Розовое игристое брют\nСорта винограда: Глера, Пино Нуар", "uz": "Turi: Pushti ko'pikli vino (brut)\nUzum navlari: Glera, Pino Nuar", "en": "Type: Rosé sparkling (brut)\nGrapes: Glera, Pinot Noir", "hru": "Розовое просекко официально разрешили только в 2020 году: к белой Глере добавляют немного Пино Нуар. Самое молодое из итальянских игристых.", "huz": "Pushti prosekko faqat 2020-yilda rasman ruxsat etilgan: oq Glera'ga ozgina Pino Nuar qo'shiladi. Italiya gazlangan vinolarining eng yoshi.", "hen": "Rosé prosecco was officially allowed only in 2020: a little Pinot Noir is added to white Glera. The youngest of Italy's ral; soft, with good freshness and a long, savory finish.", "hru": "Винодельня Botter основана в 1928 году — этот год стоит на этикетке. Венето, Италия: родина просекко и ароматных брютов.", "huz": "Botter vinochilik korxonasi 1928-yilda tashkil etilgan — shu yil yorliqda turibdi. Veneto, Italiya: prosekko va xushbo'y bryutlar vatani.", "hen": "The Botter winery was founded in 1928 — the year printed on the label. Veneto, Italy: the homeland of prosecco and fragrant bruts.", "price": "300 000", "off": false, "g": "Seasonal", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "mw13", "cat": "x62gapjt6u", "n": "Abrau-Durso Brut", "nr": "Абрау-Дюрсо Брют", "nu": "Abrau-Durso Brut", "meta": "0.75L", "ru": "Тип: Белое игристое брют\nКрепость: 12%\nСтрана: Россия, Краснодарский край\nСорта винограда: Совиньон блан, Рислинг, Шардоне, Алиготе, Пино блан\nАромат и вкус: Цветочные и фруктовые ноты; свежий, бодрящий, сухой вкус.", "uz": "Turi: Oq ko'pikli vino (brut)\nAlkogol miqdori: 12%\nDavlat: Rossiya, Krasnodar o'lkasi\nUzum navlari: Sovinyon blan, Riesling, Shardone, Aligote, Pino blan\nAroma va ta'mi: Gulli va mevali notalar; yangi, tetiklantiruvchi, quruq ta'm.", "en": "Type: Dry white sparkling (brut)\nStrength: 12%\nCountry: Russia, Krasnodar Krai\nGrapes: Sauvignon Blanc, Riesling, Chardonnay, Aligoté, Pinot Blanc\nAroma and taste: Floral and fruity notes; a fresh, lively, dry taste.", "hru": "Основано по указу императора Александра II в 1870 году на берегу озера Абрау под Новороссийском. Позже Абрау-Дюрсо стало поставщиком императорского двора.", "huz": "1870-yilda imperator Aleksandr II farmoni bilan Novorossiysk yaqinidagi Abrau ko'li bo'yida tashkil etilgan. Keyinroq Abrau-Dyurso imperator saroyining yetkazib beruvchisiga aylangan.", "hen": "Founded by decree of Emperor Alexander II in 1870 on the shore of Lake Abrau near Novorossiysk. Abrau-Durso later became a supplier to the imperial court.", "price": "250 000", "off": false, "g": "Seasonal", "sg": "", , "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "s6", "cat": "soft", "n": "BonAqua Still", "nr": "БонАква негазированная", "nu": "BonAqua gazsiz", "meta": "0.5 L", "ru": "без газа", "uz": "gazsiz", "en": "still", "hru": "Вода Coca-Cola; имя — от латинского bona aqua, «хорошая вода». Очищена, минерализована, без газа.", "huz": "Coca-Cola suvi; nomi lotincha bona aqua — «yaxshi suv»dan. Tozalangan, minerallashtirilgan, gazsiz.", "hen": "A Coca-Cola water; the name comes from the Latin bona aqua, “good water”. Purified, mineralised, still.", "price": "15 000", "off": false, "g": "BonAqua", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "s7", "cat": "soft", "n": "Red Bull", "nr": "Ред Булл", "nu": "Red Bull", "meta": "0.25 L", "ru": "энергетический напиток", "uz": "energetik ichimlik", "en": "energy drink", "hru": "Австрия, 1987: Дитрих Матешиц попробовал тайский тоник Krating Daeng — «красный гаур» — и адаптировал его для западного рынка. Теперь «бык» знаком в каждой точке мира.", "huz": "Avstriya, 1987: Ditrix Mateshits tailand toniki Krating Daeng — «qizil gaur»ni tatib ko'rib, uni g'arb bozori uchun moslashtirgan. Endi «buqa» dunyoning har bir nuqtasida tanish.", "hen": "Austria, 1987: Dietrich Mateschitz tasted the Thai tonic Krating Daeng — “red gaur” — and adapted it for the Western market. Now the “bull” is known across the globe.", "price": "40 000", "off": false, "g": "Energy", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "s8", "cat": "soft", "n": "Red Bull Zero", "nr": "Ред Булл Зеро", "nu": "Red Bull Zero", "meta": "0.25 L", "ru": "без сахара", "uz": "shakarsiz", "en": "sugar-free", "hru": "Версия без сахара с привычным вкусом Red Bull: тот же характер, но легче.", "huz": "Shakarsiz versiya, odatiy Red Bull ta'mi bilan: o'sha xarakter, ammo yengilroq.", "hen": "The sugar-free version with the familiar Red Bull taste: the same character, but lighter.", "price": "40 000", "off": false, "g": "Energy", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "s9", "cat": "soft", "n": "Juice Assortment", "nr": "Сок в ассортименте", "nu": "Turli sharbatlar", "meta": "", "ru": "пакетированный сок на выбор", "uz": "tanlash uchun qadoqlangan sharbat", "en": "packaged juice, choice of flavours", "hru": "", "huz": "", "hen": "", "price": "35 000", "off": false, "g": "Juice", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "s10", "cat": "soft", "n": "Schweppes", "nr": "Швепс", "nu": "Schweppes", "meta": "0.33 L", "ru": "газированный напиток", "uz": "gazlangan ichimlik", "en": "carbonated soft drink", "hru": "Женева, 1783: Якоб Швепп наладил промышленный розлив газированной воды — так началась история бренда. В 1870 году Schweppes выпустил индийский тоник — тот, что пьют с джином.", "huz": "Jeneva, 1783: Yakob Shvepp gazlangan suvni sanoat miqyosida shishalay boshlagan — brend tarixi shundan boshlangan. 1870-yilda Schweppes hind tonigini chiqargan — jin bilan ichiladigan aynan o'sha.", "hen": "Geneva, 1783: Jacob Schweppe began bottling carbonated water on an industrial scale — the start of the brand's story. In 1870 Schweppes launched Indian tonic, the one drunk with gin.", "price": "30 000", "off": false, "g": "Schweppes", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn0", "cat": "snack", "n": "Kurt", "nr": "Курт", "nu": "Qurt", "meta": "", "ru": "Кисловато-солёные сушёные шарики из кисломолочного сыра, классика Центральной Азии", "uz": "Nordonroq-sho'r quritilgan qurt sharchalari — Markaziy Osiyo klassikasi", "en": "Tangy-salty dried fermented-milk cheese balls, a Central Asian classic", "hru": "Курт — сухие шарики из солёного кислого сыра. Кочевники Центральной Азии брали их в дальние переходы: не портятся и придают сил. К пиву — лучшая закуска.", "huz": "Kurt — sho'r nordon pishloqdan tayyorlangan quruq sharchalar. Markaziy Osiyo ko'chmanchilari ularni uzoq yo'llarga olib ketishgan: buzilmaydi va kuch beradi. Pivo bilan eng yaxshi tamaddi.", "hen": "Kurt is a dry ball of salty, tangy cheese. Central Asian nomads took it on long journeys: it never spoils and gives strength. The best snack with beer.", "price": "30 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn1", "cat": "snack", "n": "Lime", "nr": "Лайм", "nu": "Laym", "meta": "", "ru": "Свежий лайм", "uz": "Yangi laym", "en": "Fresh lime", "hru": "Лайм зеленее и кислее лимона. В XIX веке британских моряков прозвали «limeys» — за лаймовый сок, который спасал их от цинги.", "huz": "Laym limondan yashilroq va nordonroq. XIX asrda britaniyalik dengizchilarni «limeys» deb atashgan — ularni singadan saqlagan laym sharbati tufayli.", "hen": "Lime is greener and sharper than lemon. In the 19th century British sailors were nicknamed “limeys” — for the lime juice that saved them from scurvy.", "price": "20 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn2", "cat": "snack", "n": "Lemon", "nr": "Лимон", "nu": "Limon", "meta": "", "ru": "Свежий лимон", "uz": "Yangi limon", "en": "Fresh lemon", "hru": "Лимон родом из Северной Индии и Китая; в Европу его привезли арабы. В 1493 году Колумб повёз саженцы лимона в Новый Свет.", "huz": "Limon Shimoliy Hindiston va Xitoydan chiqqan; Yevropaga uni arablar olib kelgan. 1493-yilda Kolumb limon ko'chatlarini Yangi Dunyoga olib ketgan.", "hen": "The lemon comes from northern India and China; Arabs brought it to Europe. In 1493 Columbus took lemon seedlings to the New World.", "price": "20 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn3", "cat": "snack", "n": "Almonds", "nr": "Миндаль", "nu": "Bodom", "meta": "", "ru": "Солёный жареный миндаль", "uz": "Tuzlangan qovurilgan bodom", "en": "Salted roasted almonds", "hru": "Миндаль на самом деле не орех, а косточка плода — близкого родственника персика и сливы. Один из самых древних культурных «орехов» мира.", "huz": "Bodom aslida yong'oq emas, shaftoli va olxo'rining yaqin qarindoshi bo'lgan mevaning danagi. Dunyodagi eng qadimgi madaniy «yong'oq»lardan biri.", "hen": "The almond is not actually a nut but the seed of a fruit closely related to the peach and the plum. One of the oldest cultivated “nuts” in the world.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn4", "cat": "snack", "n": "Suluguni", "nr": "Сулугуни", "nu": "Sulguni", "meta": "", "ru": "Копчёный сулугуни, нарванный на тонкие «паутинки»", "uz": "Dudlangan sulguni, ingichka «o'rgimchak to'ri» ipchalariga yirtilgan", "en": "Smoked suluguni, hand-pulled into fine, web-like strands", "hru": "Сулугуни родом из Грузии, из Самегрело. Слоистую текстуру ему даёт особая выдержка: сырную массу вымешивают в горячей сыворотке.", "huz": "Suluguni Gruziyaning Samegrelo hududidan chiqqan. Qatlamli tuzilishini maxsus usul beradi: pishloq massasi issiq zardobda ezib aralashtiriladi.", "hen": "Suluguni comes from Samegrelo in Georgia. Its layered texture comes from a special method: the cheese curd is kneaded in hot whey.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn5", "cat": "snack", "n": "Pistachios", "nr": "Фисташки", "nu": "Pista", "meta": "", "ru": "Солёные жареные фисташки", "uz": "Tuzlangan qovurilgan pista", "en": "Salted roasted pistachios", "hru": "В Иране фисташки называют «смеющимися орехами»: скорлупа раскрывается, как улыбка. Это один из древнейших орехов, который люди ели ещё в каменном веке.", "huz": "Eronda pistani «kulayotgan yong'oq» deyishadi: po'chog'i tabassum kabi ochiladi. Bu odamlar tosh asridayoq yegan eng qadimgi yong'oqlardan biri.", "hen": "In Iran pistachios are called “laughing nuts”: the shell opens like a smile. It is one of the oldest nuts, eaten by people as far back as the Stone Age.", "price": "45 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn6", "cat": "snack", "n": "Chips", "nr": "Чипсы", "nu": "Chips", "meta": "", "ru": "Хрустящие картофельные чипсы", "uz": "Qarsildoq kartoshka chipsi", "en": "Crispy potato chips", "hru": "По легенде, в 1853 году повар Джордж Крам из Саратога-Спрингс нарезал картофель тонко, раздражённый придирчивым гостем. Гость остался в восторге — и родились чипсы.", "huz": "Rivoyatga ko'ra, 1853-yilda Saratoga-Springsdagi oshpaz Jorj Krum talabchan mehmondan g'ashi kelib, kartoshkani yupqa kesgan. Mehmon zavqlangan — chipslar shunday tug'ilgan.", "hen": "Legend says that in 1853 chef George Crum of Saratoga Springs, annoyed by a fussy guest, sliced potatoes paper-thin. The guest was delighted — and chips were born.", "price": "35 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "sn7", "cat": "snack", "n": "Beer Set", "nr": "Пивной сет", "nu": "Pivo to'plami", "meta": "", "ru": "Подборка закусок к пиву", "uz": "Pivo uchun gazaklar to'plami", "en": "A selection of snacks for beer", "hru": "В баварских пивных на столах всегда лежат брецели, а в чешских подают сыр и колбаски. Хруст, соль и кислинка заставляют вкус пива раскрываться сильнее.", "huz": "Bavariya pivoxonalarida stollarda doim bretsel turadi, chex pivoxonalarida esa pishloq va kolbasa beriladi. Qarsildoqlik, tuz va nordonlik pivo ta'mini kuchliroq ochadi.", "hen": "In Bavarian beer halls pretzels always sit on the tables, while Czech pubs serve cheese and sausages. Crunch, salt and tang make the flavour of beer open up.", "price": "110 000", "off": false, "g": "", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "tx0", "cat": "tea", "n": "Mint", "nr": "Мята", "nu": "Yalpiz", "meta": "", "ru": "Свежая мята", "uz": "Yangi yalpiz", "en": "Fresh mint", "hru": "Освежает чай и добавляет прохладную нотку.", "huz": "Choyga salqin ohang va yangilik beradi.", "hen": "Refreshes the tea with a cool, aromatic note.", "price": "10 000", "off": false, "g": "Extras", "sg": "", "p1": "", "bs": "", "cc": ""}, {"vs": "", "id": "tx1", "cat": "tea", "n const ICON={pin:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16" fill="currentColor"><g><path d="M128,64a40,40,0,1,0,40,40A40,40,0,0,0,128,64Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,128Zm0-112a88.1,88.1,0,0,0-88,88c0,31.4,14.51,64.68,42,96.25a254.19,254.19,0,0,0,41.45,38.3,8,8,0,0,0,9.18,0A254.19,254.19,0,0,0,174,200.25c27.45-31.57,42-64.85,42-96.25A88.1,88.1,0,0,0,128,16Zm0,206c-16.53-13-72-60.75-72-118a72,72,0,0,1,144,0C200,161.23,144.53,209,128,222Z"></path></g></svg>`,tel:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16" fill="currentColor"><g><path d="M222.37,158.46l-47.11-21.11-.13-.06a16,16,0,0,0-15.17,1.4,8.12,8.12,0,0,0-.75.56L134.87,160c-15.42-7.49-31.34-23.29-38.83-38.51l20.78-24.71c.2-.25.39-.5.57-.77a16,16,0,0,0,1.32-15.06l0-.12L97.54,33.64a16,16,0,0,0-16.62-9.52A56.26,56.26,0,0,0,32,80c0,79.4,64.6,144,144,144a56.26,56.26,0,0,0,55.88-48.92A16,16,0,0,0,222.37,158.46ZM176,208A128.14,128.14,0,0,1,48,80,40.2,40.2,0,0,1,82.87,40a.61.61,0,0,0,0,.12l21,47L83.2,111.86a6.13,6.13,0,0,0-.57.77,16,16,0,0,0-1,15.7c9.06,18.53,27.73,37.06,46.46,46.11a16,16,0,0,0,15.75-1.14,8.44,8.44,0,0,0,.74-.56L168.89,152l47,21.05h0s.08,0,.11,0A40.21,40.21,0,0,1,176,208Z"></path></g></svg>`,ig:`<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334"/></svg>`,tg:`<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M15.9 2.5L13.5 14c-.2.8-.6 1-1.3.6L8.6 11.9l-1.7 1.7c-.2.2-.4.4-.8.4l.3-3.7 6.7-6c.3-.3-.1-.4-.5-.2L4.3 9.3.7 8.2c-.8-.2-.8-.8.2-1.2L14.7 1.7c.7-.2 1.2.2 1.2.8z"/></svg>`};
const IC_SEARCH='<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M14 18C18.4183 18 22 14.4183 22 10C22 5.58172 18.4183 2 14 2C9.58172 2 6 5.58172 6 10C6 11.8487 6.62708 13.551 7.68014 14.9056L2.29289 20.2929L3.70711 21.7071L9.09436 16.3199C10.449 17.3729 12.1513 18 14 18ZM14 16C10.6863 16 8 13.3137 8 10C8 6.68629 10.6863 4 14 4C17.3137 4 20 6.68629 20 10C20 13.3137 17.3137 16 14 16Z" fill="#000"/></svg>';
const IC_BACK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.41412 13L12.707 19.2929L11.2928 20.7071L2.58569 12L11.2928 3.29289L12.707 4.70711L6.41412 11H20.9999V13H6.41412Z" fill="#000"/></svg>';
function qbtn(k,small){const q=qty(k);return `<div class="order-action ${small?'order-action--small':''} ${q?'order-action--value':''}"><button class="order-action-button _remove" data-d="-1" data-k="${k}"><span class="order-action-button__action-sign">−</span></button><span class="order-action-count">${q||''}</span><button class="order-action-button _add" data-d="1" data-k="${k}"><span class="order-action-button__action-sign">+</span></button></div>`}
function price(p,lbl,small){return `<div class="menu-item-price ${small?'menu-item-price--small':''}"><div class="menu-item-price__current"><b>${fmt(p)}</b><span>${t('cur')}</span></div>${lbl?`<span class="menu-item-price__lbl">${E(lbl)}</span>`:''}</div>`}
function card(i){const v=variants(i);const sub=[i.meta,i.cc].filter(Boolean).join(' · ');const h=hs(i);const one=!i.off&&v.length===1&&!i.vs;
return `<div class="menu-item-list__item _wi"><div class="menu-item _without-image" id="it-${i.id}"><div class="menu-item-content"><div class="menu-item-header"><h3 class="menu-item-title">${E(nm(i))}${i.sg&&i.sg!=='Classic'?`<span class="menu-item-title__tag">${E(i.sg)}</span>`:''}</h3>${sub?`<span class="menu-item-weight">${E(sub)}</span>`:''}</div>
${i.off?`<div class="menu-item-na">${t('na')}</div>`:''}${ds(i)?`<div class="base-text-collapse"><p>${E(ds(i))}</p></div>`:''}${h?`<button class="menu-item-more" data-more="${i.id}">${t('hist')} ▾</button><div class="menu-item-hist">${E(h)}</div>`:''}
${one?`<div class="menu-item-footer">${price(v[0].p)}${qbtn(v[0].k)}</div>`:''}${!i.off&&v.length>1?v.map(x=>`<div class="menu-item-footer">${price(x.p,x.l)}${qbtn(x.k)}</div>`).join(''):''}</div></div></div>`}
function head(back){const s=D.site;const a=lang==='ru'?s.ar:lang==='uz'?s.au:s.ae;
return `${back?`<div class="place-nav"><div class="place-nav__inner"><button class="back-button" id="back">${IC_BACK}</button></div></div>`:''}<div class="place-body"><div class="place-header wrapper"><div class="place-header__bg"></div><div class="place-header__main"><div class="place-header__actions"><select class="locale-switcher" id="lang">${['ru','en','uz'].map(l=>`<option value="${l}" ${l===lang?'selected':''}>${{ru:'Русский',en:'English',uz:'Oʻzbekcha'}[l]}</option>`).join('')}</select></div></div></div>
<div class="place-content wrapper"><h1 class="place-title">Agora Lounge &amp; Bar</h1><div class="place-info"><div class="place-info__address"><div class="place-info__block">${ICON.pin}<a href="${E(s.map)}" target="_blank">${E(a)}</a></div><div class="place-info__block">${ICON.tel}<a href="tel:${s.phone.replace(/\s/g,'')}">${E(s.phone)}</a></div><div class="place-info__block">${ICON.ig}<a href="https://instagram.com/${s.ig}" target="_blank">${E(s.ig)}</a></div><div class="place-info__block">${ICON.tg}<a href="https://t.me/${s.tg}" target="_blank">${E(s.tg)}</a></div></div><div class="place-info__description"><p>${t('info')}</p></div></div>
<div class="menu-list" id="mlist"><div class="base-scrollbar">${[['bar',{ru:'Бар',en:'Bar',uz:'Bar'}],['hookah',{ru:'Кальяны',en:'Hookahs',uz:'Kalyanlar'}]].map(([k,n])=>`<div class="menu ${k===tab?'_selected':''}"><button class="menu__button" data-tab="${k}">${n[lang]}</button></div>`).join('')}</div></div></div>
<div class="menu-item-search" id="srch"><form class="menu-item-search-form" onsubmit="return false"><div class="menu-item-search-form-field"><div class="base-form-input"><input class="base-form-input-input" id="q" type="search" placeholder="${t('search')}"></div><button class="round-button menu-item-search-form-button" aria-label="${t('search')}" type="button">${IC_SEARCH}</button></div></form></div>
<div class="cafe-list" id="body"></div><div class="place-content__footer">Agora Lounge &amp; Bar · Tashkent</div></div></div>`}
const CBG=['linear-gradient(135deg,#b5653a,#5a2c14)','linear-gradient(135deg,#3f7d73,#173a36)','linear-gradient(135deg,#b06088,#4a1d33)','linear-gradient(135deg,#c4a24a,#5c4a14)','linear-gradient(135deg,#5b78b5,#1d2c52)','linear-gradient(135deg,#8a63b5,#33194f)','linear-gradient(135deg,#b55b5b,#4d1a1a)','linear-gradient(135deg,#5ea074,#1d3f2a)'];
function homeBody(){return `<div class="category-list">${D.cats.filter(c=>(c.m||'bar')===tab).map((c,k)=>`<div class="category-list__item"><div class="category-item"><button class="category-item__link" style="background-image:${CBG[k%CBG.length]}" data-cat="${c.id}"><h2 class="h2">${E(cn(c))}</h2></button></div></div>`).join('')}</div>`}
function customBody(c){const C=D.custom,L=CU[lang];const brands=[];C.tob.forEach((x,j)=>{let g=brands.find(b=>b.b===x[0]);if(!g){g={b:x[0],a:[]};brands.push(g)}g.a.push([j,x[1]])});
const n=cu.sel.length;
return `<div class="menu-item-list cu"><h2 class="h2 menu-item-list__title">${E(cn(c))}</h2><p class="menu-item-list__description">${E(L.hint)}</p>
<div class="cu-label">${L.str}</div><div class="cu-str">${['L','M','H'].map(s=>`<button class="cu-s ${cu.st===s?'on':''}" data-cust="${s}">${ST[lang][s]}</button>`).join('')}</div>
<div class="cu-count"><span>${L.sel}: <b>${n}</b> ${L.of} ${C.max}</span>${n?`<button class="cu-reset" data-curst="1">${L.reset}</button>`:''}</div>
${brands.map(g=>`<div class="cu-brand">${E(g.b)}</div><div class="cu-chips">${g.a.map(([j,nme])=>`<button class="cu-chip ${cu.sel.includes(j)?'on':''}" data-tb="${j}">${E(nme)}</button>`).join('')}</div>`).join('')}
<div class="cu-foot">${price(C.price)}<button class="cu-add" data-cuadd="1" ${n?'':'disabled'}>${L.add}</button></div></div>`}
function catBody(id){const c=D.cats.find(x=>x.id===id);if(!c)return '';if(id==='hk_custom')return customBody(c);const its=D.items.filter(i=>i.cat===id);let out=`<div class="menu-item-list"><h2 class="h2 menu-item-list__title">${E(cn(c))}</h2>`;if(ld(c))out+=`<p class="menu-item-list__description">${E(ld(c))}</p>`;let g=null;its.forEach(i=>{if((i.g||'')!==g){g=i.g||'';if(g)out+=`<div class="menu-item-list__group">${E(g.split('○')[lang==='ru'?1:lang==='uz'?2:0]||g)}</div>`}out+=card(i)});return out+'</div>'}
function searchBody(q){q=q.toLowerCase();const r=D.items.filter(i=>[i.n,i.nr,i.nu,i.ru,i.uz,i.en].join(' ').toLowerCase().includes(q));return r.length?`<div class="menu-item-list">${r.map(card).join('')}</div>`:`<p class="menu-item-search-result__empty">${t('empty')}</p>`}
function orderBody(){const ks=Object.keys(cart).filter(k=>cart[k]>0);if(!ks.length)return `<h2 class="h2" style="margin-top:8px">${t('myorder')}</h2><p class="menu-item-search-result__empty">${t('noorder')}</p>`;let tot=0;const rows=ks.map(k=>{const {i,v}=vk(k);if(!v)return '';tot+=v.p*cart[k];return `<div class="order-item"><h3 class="order-item-title">${E(nm(i))}${v.l?` <span class="menu-item-weight">${E(v.l)}</span>`:''}</h3><div class="order-item-footer">${price(v.p,'',true)}${qbtn(k,true)}</div></div>`}).join('');
return `<h2 class="h2" style="margin-top:8px">${t('myorder')}</h2>${rows}<div class="order-total"><span>${t('total')}:</span>${price(tot)}</div><p class="order-hint">${t('hint')}</p>${D.site.orderUrl?`<div class="osend"><label>${OT[lang].table}<input id="otable" inputmode="numeric" maxlength="6" value="${E(tableV)}" ${tableQ?'readonly':''}></label><label>${OT[lang].comment}<textarea id="ocomm" rows="2" maxlength="300">${E(commentV)}</textarea></label><button class="cu-add osend-btn" id="osend">${OT[lang].send}</button><p class="osend-msg" id="omsg"></p></div>`:''}<button class="order-clear" id="clr">${t('clear')}</button>`}
function route(){return location.hash.slice(1)}
function render(keepQ){const r=route();const inOrder=r==='order',cat=r.startsWith('c/')?r.slice(2):null;if(cat){const cc=D.cats.find(x=>x.id===cat);if(cc)tab=cc.m||'bar'}
const app=document.getElementById('app');app.innerHTML=head(inOrder||!!cat);
const body=document.getElementById('body');
body.innerHTML=inOrder?orderBody():cat?catBody(cat):homeBody();
const q=document.getElementById('q');if(inOrder){document.getElementById('srch').style.display='none';document.getElementById('mlist').style.display='none'}
if(keepQ){q.value=keepQ;q.dispatchEvent(new Event('input',{bubbles:true}))}
cartbar()}
function cartbar(){let n=0,tot=0;for(const k in cart){if(cart[k]>0){n+=cart[k];const {i,v}=vk(k);if(v)tot+=v.p*cart[k]}}
const bar=document.getElementById('barbtn');bar.hidden=!n||route()==='order';bar.innerHTML=`<span>${t('order')}</span><span>· ${fmt(tot)} ${t('cur')}</span>`}
async function sendOrder(){const L=OT[lang],msg=document.getElementById('omsg'),btn=document.getElementById('osend');const say=(m,c)=>{msg.textContent=m;msg.className='osend-msg '+c};
if(!tableV){say(L.needtable,'bad');return}
const items=Object.keys(cart).filter(k=>cart[k]>0).map(k=>{const {i,v}=vk(k);return v&&{name:i.nr||i.n,label:v.l||'',qty:cart[k],price:v.p}}).filter(Boolean);if(!items.length)return;
btn.disabled=true;say(L.sending,'');
try{const r=await fetch(D.site.orderUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:tableV,comment:commentV,items,lang})});if(!r.ok)throw 0;cart={};commentV='';save();say(L.sent,'ok');document.querySelectorAll('.order-item,.order-total,.order-clear,.order-hint').forEach(x=>x.remove());btn.remove();cartbar()}catch(e){btn.disabled=false;say(L.err,'bad')}}
document.addEventListener('click',e=>{const b=e.target.closest('#osend,[data-tb],[data-cust],[data-curst],[data-cuadd],[data-tab],[data-cat],[data-d],[data-more],#back,#clr,#barbtn');if(!b)return;
const rb=()=>{const y=scrollY;document.getElementById('body').innerHTML=catBody('hk_custom');scrollTo(0,y)};
if(b.id==='osend'){sendOrder();return}
if(b.dataset.tb!==undefined){const j=+b.dataset.tb,x=cu.sel.indexOf(j);if(x>=0)cu.sel.splice(x,1);else if(cu.sel.length<D.custom.max)cu.sel.push(j);else return;rb()}
else if(b.dataset.cust){cu.st=b.dataset.cust;rb()}
else if(b.dataset.curst){cu.sel=[];rb()}
else if(b.dataset.cuadd){if(!cu.sel.length)return;const k='cu|'+cu.st+'|'+cu.sel.slice().sort((a,c)=>a-c).join('.');cart[k]=(cart[k]||0)+1;save();cu.sel=[];rb();cartbar()}
else if(b.dataset.tab){tab=b.dataset.tab;if(route()){location.hash=''}else render()}
else if(b.dataset.cat){location.hash='c/'+b.dataset.cat;window.scrollTo(0,0)}
else if(b.dataset.d){const k=b.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+ +b.dataset.d);if(!cart[k])delete cart[k];save();const y=scrollY;const q=(document.getElementById('q')||{}).value;render(q);scrollTo(0,y)}
else if(b.dataset.more){const it=document.getElementById('it-'+b.dataset.more);it.classList.toggle('_open');b.innerHTML=t(it.classList.contains('_open')?'hide':'hist')+(it.classList.contains('_open')?' ▴':' ▾')}
else if(b.id==='back'){location.hash=''; window.scrollTo(0,0)}
else if(b.id==='clr'){cart={};save();render()}
else if(b.id==='barbtn'){location.hash='order';scrollTo(0,0)}});
document.addEventListener('input',e=>{if(e.target.id==='otable'){tableV=e.target.value.replace(/\D/g,'');e.target.value=tableV;return}if(e.target.id==='ocomm'){commentV=e.target.value;return}if(e.target.id!=='q')return;const v=e.target.value.trim();const body=document.getElementById('body');
if(v.length>=2)body.innerHTML=searchBody(v);else{const r=route();body.innerHTML=r.startsWith('c/')?catBody(r.slice(2)):homeBody()}});
document.addEventListener('change',e=>{if(e.target.id==='lang'){lang=e.target.value;save();document.documentElement.lang=lang;render()}});
window.addEventListener('hashchange',()=>render());render();
</script></body></html>
